<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM - Управление заказами</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <header class="header">
            <div class="container">
                <div class="header-content">
                    <h1><i class="fas fa-box"></i> CRM Заказы</h1>
                    <div class="header-actions">
                        <span id="userInfo" class="user-info"></span>
                        <button id="logoutBtn" class="btn btn-outline" style="display:none;">
                            <i class="fas fa-sign-out-alt"></i> Выйти
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="container">
                <!-- Блок авторизации -->
                <section id="authSection" class="section">
                    <div class="auth-container">
                        <div class="auth-card">
                            <h2><i class="fas fa-lock"></i> Авторизация</h2>
                            <form id="authForm">
                                <div class="form-group">
                                    <label for="authEmail">Email</label>
                                    <input type="email" id="authEmail" placeholder="example@mail.com" required />
                                </div>
                                <div class="form-group">
                                    <label for="authPassword">Пароль</label>
                                    <input type="password" id="authPassword" placeholder="••••••••" required />
                                </div>
                                <div id="authError" class="error-message"></div>
                                <button type="submit" class="btn btn-primary btn-full">
                                    <i class="fas fa-sign-in-alt"></i> Войти
                                </button>
                                <p class="auth-hint">
                                    Нет аккаунта? <a href="#" id="showRegister">Зарегистрироваться</a>
                                </p>
                            </form>
                            <form id="registerForm" style="display:none;">
                                <div class="form-group">
                                    <label for="regEmail">Email</label>
                                    <input type="email" id="regEmail" placeholder="example@mail.com" required />
                                </div>
                                <div class="form-group">
                                    <label for="regPassword">Пароль (минимум 6 символов)</label>
                                    <input type="password" id="regPassword" placeholder="••••••••" required />
                                </div>
                                <div id="regError" class="error-message"></div>
                                <button type="submit" class="btn btn-success btn-full">
                                    <i class="fas fa-user-plus"></i> Зарегистрироваться
                                </button>
                                <p class="auth-hint">
                                    Уже есть аккаунт? <a href="#" id="showLogin">Войти</a>
                                </p>
                            </form>
                        </div>
                    </div>
                </section>

                <!-- Блок управления заказами -->
                <section id="ordersSection" class="section" style="display:none;">
                    <div class="toolbar">
                        <button id="createOrderBtn" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Создать заказ
                        </button>
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="Поиск по номеру или клиенту..." />
                        </div>
                        <div class="filter-group">
                            <select id="statusFilter">
                                <option value="all">Все статусы</option>
                                <option value="новый">Новый</option>
                                <option value="в работе">В работе</option>
                                <option value="готово">Готово</option>
                                <option value="отменен">Отменен</option>
                            </select>
                        </div>
                    </div>

                    <div id="ordersList" class="orders-list">
                        <!-- Заказы будут загружены сюда -->
                    </div>

                    <div id="pagination" class="pagination">
                        <!-- Пагинация -->
                    </div>
                </section>
            </div>
        </main>

        <!-- Модальное окно для создания/редактирования заказа -->
        <div id="orderModal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2 id="modalTitle"><i class="fas fa-edit"></i> Создание заказа</h2>
                <form id="orderForm">
                    <input type="hidden" id="orderId" />
                    <div class="form-group">
                        <label for="orderNumber">Номер заказа</label>
                        <input type="text" id="orderNumber" placeholder="ORD-2024-001" required />
                    </div>
                    <div class="form-group">
                        <label for="clientName">Клиент</label>
                        <input type="text" id="clientName" placeholder="Иван Иванов" required />
                    </div>
                    <div class="form-group">
                        <label for="orderAmount">Сумма (₽)</label>
                        <input type="number" id="orderAmount" placeholder="1000" min="0" step="0.01" required />
                    </div>
                    <div class="form-group">
                        <label for="orderStatus">Статус</label>
                        <select id="orderStatus">
                            <option value="новый">Новый</option>
                            <option value="в работе">В работе</option>
                            <option value="готово">Готово</option>
                            <option value="отменен">Отменен</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="orderDescription">Описание</label>
                        <textarea id="orderDescription" rows="3" placeholder="Детали заказа..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success" id="saveOrderBtn">
                            <i class="fas fa-save"></i> Сохранить
                        </button>
                        <button type="button" class="btn btn-secondary" id="cancelModalBtn">
                            <i class="fas fa-times"></i> Отмена
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Модальное подтверждение удаления -->
        <div id="deleteModal" class="modal">
            <div class="modal-content modal-small">
                <span class="modal-close">&times;</span>
                <h2><i class="fas fa-exclamation-triangle" style="color:#e74c3c;"></i> Подтверждение</h2>
                <p>Вы уверены, что хотите удалить заказ <strong id="deleteOrderNumber"></strong>?</p>
                <div class="form-actions">
                    <button id="confirmDeleteBtn" class="btn btn-danger">
                        <i class="fas fa-trash"></i> Удалить
                    </button>
                    <button id="cancelDeleteBtn" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Отмена
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
