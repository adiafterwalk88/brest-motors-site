{% extends "base.html" %}

{% block title %}Регистрация - Brest Motors CRM{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2><i class="fas fa-user-plus"></i> Регистрация</h2>
        <form method="POST">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" placeholder="ivanov" required />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required />
            </div>
            <div class="form-group">
                <label for="password">Пароль (минимум 6 символов)</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required />
            </div>
            <div class="form-group">
                <label for="password_confirm">Подтверждение пароля</label>
                <input type="password" id="password_confirm" name="password_confirm" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-success btn-full">
                <i class="fas fa-user-plus"></i> Зарегистрироваться
            </button>
            <p class="auth-hint">
                Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
