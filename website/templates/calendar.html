{% extends "base.html" %}

{% block title %}Календарь заказов — InTarget Brest Motors{% endblock %}

{% block page_title %}
<div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
    <h1 style="font-size: 20px; margin: 0; color: #fff; display: flex; align-items: center; gap: 8px;">
        📅 Календарь заказов
    </h1>
    <a href="/orders" class="btn" style="background: var(--accent-gold); color: #000; font-weight: 600;">📋 Все заказы</a>
</div>
{% endblock %}

{% block content %}
<!-- ЛЕГЕНДА СТАТУСОВ -->
<div class="card" style="display: flex; gap: 20px; align-items: center; margin-bottom: 20px; padding: 12px 20px;">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #3b82f6;"></span> Новый заказ
    </div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #f59e0b;"></span> В работе
    </div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #10b981;"></span> Выдан / Завершён
    </div>
</div>

<!-- СЕТКА КАЛЕНДАРЯ -->
<div class="card" style="padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <button id="prevMonth" class="btn" style="background: rgba(255,255,255,0.05); color: #fff;">◀ Назад</button>
        <h2 id="currentMonthYear" style="margin: 0; font-size: 18px; color: #fff;"></h2>
        <button id="nextMonth" class="btn" style="background: rgba(255,255,255,0.05); color: #fff;">Вперед ▶</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border-color); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden;">
        <!-- Дни недели -->
        <div style="background: #121214; padding: 10px; text-align: center; font-weight: 600; font-size: 13px; color: var(--text-muted);">Пн</div>
        <div style="background: #121214; padding: 10px; text-align: center; font-weight: 600; font-size: 13px; color: var(--text-muted);">Вт</div>
        <div style="background: #121214; padding: 10px; text-align: center; font-weight: 600; font-size: 13px; color: var(--text-muted);">Ср</div>
        <div style="background: #121214; padding: 10px; text-align: center; font-weight: 600; font-size: 13px; color: var(--text-muted);">Чт</div>
        <div style="background: #121214; padding: 10px; text-align: center; font-weight: 600; font-size: 13px; color: var(--text-muted);">Пт</div>
        <div style="background: #121214; padding: 10px; text-align: center; font-weight: 600; font-size: 13px; color: var(--text-muted);">Сб</div>
        <div style="background: #121214; padding: 10px; text-align: center; font-weight: 600; font-size: 13px; color: var(--text-muted);">Вс</div>
    </div>

    <!-- Ячейки дней -->
    <div id="calendarDays" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border-color); border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 6px 6px; min-height: 400px;">
    </div>
</div>

<script>
    let currentDate = new Date();

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        document.getElementById('currentMonthYear').innerText = `${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const grid = document.getElementById('calendarDays');
        grid.innerHTML = '';

        // Корректировка под Пн-Вс
        let startOffset = firstDay === 0 ? 6 : firstDay - 1;

        // Пустые ячейки до начала месяца
        for (let i = 0; i < startOffset; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.style.background = '#141418';
            emptyCell.style.minHeight = '80px';
            grid.appendChild(emptyCell);
        }

        // Дни месяца
        const today = new Date();
        for (let day = 1; day <= daysInMonth; day++) {
            const cell = document.createElement('div');
            cell.style.background = '#1a1a1e';
            cell.style.padding = '8px';
            cell.style.minHeight = '80px';
            cell.style.display = 'flex';
            cell.style.flexDirection = 'column';
            cell.style.gap = '4px';

            const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
            
            cell.innerHTML = `
                <div style="font-size: 12px; font-weight: 700; color: ${isToday ? 'var(--accent-gold)' : '#a0a0ab'};">
                    ${day} ${isToday ? '• Сегодня' : ''}
                </div>
            `;
            grid.appendChild(cell);
        }
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    });

    renderCalendar();
</script>
{% endblock %}
