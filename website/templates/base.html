<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InTarget Brest Motors{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            --bg-color: #0d0d0f;
            --sidebar-bg: #141418;
            --card-bg: #1a1a1e;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --accent-gold: #f5c518;
            --accent-green: #2eb85c;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
        }

        .logo {
            padding: 0 20px 20px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .menu {
            list-style: none;
            padding: 15px 10px;
            margin: 0;
            flex: 1;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .menu-item.active {
            border-left: 3px solid var(--accent-gold);
        }

        .main-wrapper {
            margin-left: 240px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background-color: var(--bg-color);
        }

        .content {
            padding: 30px;
            flex: 1;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #fff;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            🎯 InTarget
        </div>
        <ul class="menu">
            <li><a href="/" class="menu-item {% if request.path == '/' %}active{% endif %}">📊 Дашборд</a></li>
            <li><a href="/orders" class="menu-item {% if '/orders' in request.path %}active{% endif %}">📋 Заказы</a></li>
            <li><a href="/clients" class="menu-item {% if '/clients' in request.path %}active{% endif %}">👥 Клиенты</a></li>
            <li><a href="/employee" class="menu-item {% if '/employee' in request.path %}active{% endif %}">👨‍🔧 Сотрудники</a></li>
            <li><a href="/chat" class="menu-item {% if '/chat' in request.path %}active{% endif %}">💬 Чат</a></li>
            <li><a href="/calendar" class="menu-item {% if '/calendar' in request.path %}active{% endif %}">📅 Календарь</a></li>
        </ul>
        <div style="padding: 10px;">
            <a href="/logout" class="menu-item" style="color: #ff4d4f;">🚪 Выйти</a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div>{% block page_title %}{% endblock %}</div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span>🔔</span>
                <span>👤 {{ session.get('username', 'Администратор') }}</span>
            </div>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
