<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InTarget — Вход</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d0d0e; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #1c1c1f; border: 1px solid rgba(255,255,255,0.08); padding: 32px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 24px; }
        .logo span { color: #d4a84b; }
        .form-group { margin-bottom: 16px; text-align: left; }
        input { width: 100%; padding: 10px 12px; background: #121214; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-size: 14px; margin-top: 4px; }
        input:focus { border-color: #d4a84b; outline: none; }
        .btn { width: 100%; padding: 10px; background: #d4a84b; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 12px; }
        .btn:hover { background: #c3973a; }
        .users-fast { display: flex; gap: 8px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .user-badge { background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 6px; text-decoration: none; color: #d4a84b; font-size: 12px; border: 1px solid rgba(212,168,75,0.2); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🎯 In<span>Target</span></div>
        <form method="POST" action="/login">
            <div class="form-group">
                <input type="text" name="username" placeholder="Логин" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn">🚀 Войти</button>
        </form>
        <div class="users-fast">
            <a href="#" class="user-badge">Админ</a>
            <a href="#" class="user-badge">Павел</a>
            <a href="#" class="user-badge">Дмитрий</a>
            <a href="#" class="user-badge">Александр</a>
        </div>
    </div>
</body>
</html>
