<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InTarget — Вход</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d0d0e; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #1c1c1f; border: 1px solid rgba(255,255,255,0.08); padding: 32px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 24px; }
        .logo span { color: #d4a84b; }
        .form-group { margin-bottom: 16px; text-align: left; }
        input { width: 100%; padding: 10px 12px; background: #121214; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-size: 14px; margin-top: 4px; }
        input:focus { border-color: #d4a84b; outline: none; }
        .btn { width: 100%; padding: 10px; background: #d4a84b; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 12px; }
        .btn:hover { background: #c3973a; }
        .flash-message { padding: 10px 14px; border-radius: 6px; background: rgba(255,77,79,0.1); border: 1px solid rgba(255,77,79,0.3); color: #ff4d4f; margin-bottom: 16px; font-size: 13px; text-align: left; }
        .flash-message.success { background: rgba(46,184,92,0.1); border-color: rgba(46,184,92,0.3); color: #2eb85c; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🎯 In<span>Target</span></div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <!-- CSRF-токен отсутствовал полностью — критическая уязвимость (login без CSRF
                 позволяет CSRF login attack: атакующий может залогинить жертву под своим
                 аккаунтом, чтобы затем отслеживать её действия под известным ему логином). -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <input type="text" name="username" placeholder="Логин" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Пароль" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">🚀 Войти</button>
        </form>
    </div>
</body>
</html>
