<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — InTarget Brest Motors</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: var(--font-family);
        }
        
        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }
        
        .login-card {
            background: var(--color-white);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.6s ease;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .login-header .logo {
            font-size: 56px;
            margin-bottom: var(--spacing-sm);
        }
        
        .login-header h1 {
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--color-primary);
        }
        
        .login-header p {
            color: var(--color-gray-600);
            font-size: var(--font-size-sm);
        }
        
        .tab-switch {
            display: flex;
            background: var(--color-gray-100);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: var(--spacing-lg);
        }
        
        .tab-switch button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: all var(--transition-normal);
            background: transparent;
            color: var(--color-gray-600);
        }
        
        .tab-switch button.active {
            background: var(--color-white);
            color: var(--color-primary);
            box-shadow: var(--shadow-sm);
        }
        
        .tab-switch button:hover {
            color: var(--color-primary);
        }
        
        .login-form {
            display: none;
        }
        
        .login-form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        .login-form .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-top: var(--spacing-sm);
        }
        
        .btn-login.admin {
            background: linear-gradient(135deg, var(--color-accent), var(--color-accent-hover));
            color: white;
        }
        
        .btn-login.admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(46, 204, 113, 0.35);
        }
        
        .btn-login.employee {
            background: linear-gradient(135deg, var(--color-info), var(--color-info-hover));
            color: white;
        }
        
        .btn-login.employee:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(52, 152, 219, 0.35);
        }
        
        .login-footer {
            text-align: center;
            margin-top: var(--spacing-lg);
            color: var(--color-gray-500);
            font-size: var(--font-size-xs);
        }
        
        .login-footer .version {
            background: var(--color-gray-100);
            padding: 2px 12px;
            border-radius: 50px;
            display: inline-block;
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: var(--spacing-lg);
            }
            
            .login-header .logo {
                font-size: 40px;
            }
            
            .login-header h1 {
                font-size: var(--font-size-lg);
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">🎯</div>
                <h1>InTarget Brest Motors</h1>
                <p>Управление заказами</p>
            </div>

            <!-- Flash-сообщения -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Вкладки -->
            <div class="tab-switch">
                <button id="tabAdmin" class="active" onclick="switchTab('admin')">👤 Админ</button>
                <button id="tabEmployee" onclick="switchTab('employee')">👨‍🔧 Сотрудник</button>
            </div>

            <!-- Форма Админа -->
            <form id="formAdmin" class="login-form active" method="POST" action="/login">
                <input type="hidden" name="login_type" value="admin">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="form-group">
                    <label class="form-label">🏪 Магазин</label>
                    <select name="shop_id" class="form-control">
                        {% for id, name in shops.items() %}
                            <option value="{{ id }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">🔑 Пароль администратора</label>
                    <input type="password" name="password" class="form-control" placeholder="Введите пароль..." required autofocus>
                </div>

                <button type="submit" class="btn-login admin">🚀 Войти как Админ</button>
            </form>

            <!-- Форма Сотрудника -->
            <form id="formEmployee" class="login-form" method="POST" action="/login">
                <input type="hidden" name="login_type" value="employee">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="form-group">
                    <label class="form-label">👨‍🔧 Выберите сотрудника</label>
                    <select name="employee_id" class="form-control">
                        {% for emp in employees %}
                            <option value="{{ emp.id }}">{{ emp.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">🔑 Пароль сотрудника</label>
                    <input type="password" name="password" class="form-control" placeholder="Введите пароль..." required>
                </div>

                <button type="submit" class="btn-login employee">🚀 Войти как Сотрудник</button>
            </form>

            <div class="login-footer">
                <span class="version">v2.0 • InTarget CRM</span>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const adminBtn = document.getElementById('tabAdmin');
            const empBtn = document.getElementById('tabEmployee');
            const adminForm = document.getElementById('formAdmin');
            const empForm = document.getElementById('formEmployee');

            if (tab === 'admin') {
                adminBtn.classList.add('active');
                empBtn.classList.remove('active');
                adminForm.classList.add('active');
                empForm.classList.remove('active');
            } else {
                empBtn.classList.add('active');
                adminBtn.classList.remove('active');
                empForm.classList.add('active');
                adminForm.classList.remove('active');
            }
        }

        // Автофокус на первом поле
        document.addEventListener('DOMContentLoaded', function() {
            const firstInput = document.querySelector('.login-form.active input');
            if (firstInput) firstInput.focus();
        });
    </script>
</body>
</html>
